name: patch-room-area-index
on:
  workflow_dispatch:
  push:
    branches: [fix/room-area-show-completed-work]
    paths: ['.github/workflows/patch-room-area.yml']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/room-area-show-completed-work
          fetch-depth: 0
      - name: Restore index.html from main and apply room-area fix
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:index.html > index.html
          python3 <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old_ver = "const APP_VERSION = '2026.09.27-h';"
          new_ver = "const APP_VERSION = '2026.09.29-a';"
          assert old_ver in text, 'APP_VERSION not found'
          text = text.replace(old_ver, new_ver, 1)
          old_vfor = '''                            <div v-for="task in tasks.filter(t => t.propertyId === viewingPropertyId && t.zone === viewingZone && !t.completed)" :key="task.id" class="bg-slate-800 rounded-2xl p-3 border border-slate-700/50 transition-all">'''
          new_vfor = '''                            <div v-for="task in viewingZoneTasks" :key="task.id" class="bg-slate-800 rounded-2xl p-3 border border-slate-700/50 transition-all" :class="task.completed ? 'opacity-50' : ''">'''
          assert old_vfor in text, 'v-for block not found'
          text = text.replace(old_vfor, new_vfor, 1)
          old_empty = '''                            <p v-if="tasks.filter(t => t.propertyId === viewingPropertyId && t.zone === viewingZone && !t.completed).length === 0" class="text-[13px] text-slate-500 text-center py-4">{{ t('noTasks') }}</p>'''
          new_empty = '''                            <p v-if="viewingZoneTasks.length === 0" class="text-[13px] text-slate-500 text-center py-4">{{ t('noTasks') }}</p>'''
          assert old_empty in text, 'empty state not found'
          text = text.replace(old_empty, new_empty, 1)
          old_comp = '''                filteredTasks() {
                    return this.tasks
                        .filter(t => !t.completed && (this.selectedPropertyId === 'ALL' || t.propertyId === this.selectedPropertyId))
                        .slice()
                        .sort((a, b) => (b.issueDate || '').localeCompare(a.issueDate || ''));
                },'''
          new_comp = '''                filteredTasks() {
                    return this.tasks
                        .filter(t => !t.completed && (this.selectedPropertyId === 'ALL' || t.propertyId === this.selectedPropertyId))
                        .slice()
                        .sort((a, b) => (b.issueDate || '').localeCompare(a.issueDate || ''));
                },
                viewingZoneTasks() {
                    if (!this.viewingPropertyId || !this.viewingZone) return [];
                    return this.tasks
                        .filter(t => t.propertyId === this.viewingPropertyId && t.zone === this.viewingZone)
                        .slice()
                        .sort((a, b) => (b.issueDate || '').localeCompare(a.issueDate || ''));
                },'''
          assert old_comp in text, 'filteredTasks computed not found'
          text = text.replace(old_comp, new_comp, 1)
          path.write_text(text, encoding='utf-8')
          print('index.html patched OK', path.stat().st_size)
          assert "viewingZoneTasks" in text
          assert "2026.09.29-a" in text
          assert "getZoneTaskCount" in text
          PY
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "bosskiw11-bot"
          git config user.email "bosskiw11@gmail.com"
          git add index.html
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: room/area detail shows completed work (2026.09.29-a)"
          git push origin HEAD:fix/room-area-show-completed-work
