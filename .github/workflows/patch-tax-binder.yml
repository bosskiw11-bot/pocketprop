name: patch-tax-receipt-binder-index
on:
  workflow_dispatch:
  push:
    branches: [fix/tax-receipt-binder]
    paths:
      - '.ci/TRIGGER_BINDER'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tax-receipt-binder
          fetch-depth: 0
      - name: Apply tax-receipt-binder index.html patch
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:index.html > index.html
          echo '' | base64 -d > /tmp/binder_apply.py
          python3 /tmp/binder_apply.py
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "bosskiw11-bot"
          git config user.email "bosskiw11@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: tax-season receipt binder (2026.09.30-a)"
          git push origin HEAD:fix/tax-receipt-binder
