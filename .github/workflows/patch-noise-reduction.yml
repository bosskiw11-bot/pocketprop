name: patch-noise-reduction-index
on:
  workflow_dispatch:
  push:
    branches: [fix/noise-reduction-pack]
    paths:
      - '.ci/TRIGGER_NOISE'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/noise-reduction-pack
          fetch-depth: 0
      - name: Apply noise-reduction index.html patch
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:index.html > index.html
          echo '' | base64 -d > /tmp/noise_apply.py
          python3 /tmp/noise_apply.py
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "bosskiw11-bot"
          git config user.email "bosskiw11@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: noise reduction pack UI (2026.09.29-b)"
          git push origin HEAD:fix/noise-reduction-pack
