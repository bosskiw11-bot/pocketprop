name: patch-noise-reduction-index
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/noise-reduction-pack
          fetch-depth: 0
      - name: Apply noise-reduction index.html patch
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:index.html > index.html
          cat .ci/np0.b64 .ci/np1.b64 .ci/np2.b64 .ci/np3.b64 .ci/np4.b64 .ci/np5.b64 .ci/np6.b64 .ci/np7.b64 > /tmp/patch.gz.b64
          base64 -d /tmp/patch.gz.b64 | gzip -d > /tmp/noise.patch
          patch -p1 < /tmp/noise.patch
          grep -q "2026.09.29-b" index.html
          ! grep -q "setRoutineNotify" index.html
          python3 -c "from pathlib import Path; t=Path('index.html').read_text(); assert '2026.09.29-b' in t and 'mapVisible' in t; print('OK', len(t))"
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "bosskiw11-bot"
          git config user.email "bosskiw11@gmail.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "fix: noise reduction pack UI (2026.09.29-b)"
          git push origin HEAD:fix/noise-reduction-pack
